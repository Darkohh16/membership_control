{% extends 'base.html' %}
{% block title %}Detalle del Socio{% endblock %}

{% block content %}
<div class="flex-grow bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8">
    <!-- Encabezado -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-gray-700">Detalle del Socio</h2>
      <a href="{% url 'socios_general' %}" class="text-blue-600 hover:underline font-medium"><- Volver</a>
    </div>

    <!-- Formulario de edición -->
    <form method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        {% csrf_token %}
      <!-- Nombre -->
      <div>
        <label for="nombre" class="block text-gray-600 font-medium mb-1">Nombre</label>
        <input type="text" id="nombre" name="nombre" value="{{ socio.nombre }}"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700
           shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
           transition duration-200">
      </div>

      <!-- Apellido -->
      <div>
        <label for="apellido" class="block text-gray-600 font-medium mb-1">Apellido</label>
        <input type="text" id="apellido" name="apellido" value="{{ socio.apellido }}"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700
           shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
           transition duration-200">
      </div>

      <!-- DNI -->
      <div>
        <label for="dni_carnet" class="block text-gray-600 font-medium mb-1">DNI / Carnet</label>
        <input type="text" id="dni_carnet" name="dni_carnet" value="{{ socio.dni_carnet }}"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700
           shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
           transition duration-200">
      </div>

      <!-- Correo -->
      <div>
        <label for="correo" class="block text-gray-600 font-medium mb-1">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" value="{{ socio.correo }}"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700
           shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
           transition duration-200">
      </div>

      <!-- Celular -->
      <div>
        <label for="celular" class="block text-gray-600 font-medium mb-1">Celular</label>
        <input type="text" id="celular" name="celular" value="{{ socio.celular }}"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700
           shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
           transition duration-200">
      </div>

      <!-- Fecha de nacimiento -->
      <div>
        <label class="block text-gray-600 font-medium mb-1">Fecha de Nacimiento</label>
        <p class="text-gray-800 bg-gray-50 rounded-lg px-4 py-2">{{ socio.fecha_nacimiento|date:"d/m/Y" }}</p>
      </div>

      <!-- Dirección -->
      <div class="md:col-span-2">
        <label for="direccion" class="block text-gray-600 font-medium mb-1">Dirección</label>
        <input type="text" id="direccion" name="direccion" value="{{ socio.direccion }}"
          class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700
           shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
           transition duration-200">
      </div>

      <!-- Fecha de registro (solo lectura) -->
      <div class="md:col-span-2">
        <label class="block text-gray-600 font-medium mb-1">Fecha de Registro</label>
        <p class="text-gray-800 bg-gray-50 rounded-lg px-4 py-2">{{ socio.fecha_registro|date:"d/m/Y" }}</p>
      </div>

      <!-- Botones -->
      <div class="md:col-span-2 flex justify-between mt-6">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
