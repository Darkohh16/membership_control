{% extends 'base.html' %}
{% block title %} Iniciar sesión {% endblock %}
{% block content %}
<div class="bg-gradient-to-r from-blue-500 to-indigo-600 flex flex-grow items-center justify-center">
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
    <h2 class="text-3xl font-bold text-center text-gray-700 mb-6">Bienvenido</h2>

    <form method="POST" class="space-y-5">
        {% csrf_token %}
      <div>
        <label for="username" class="block text-gray-600 font-medium mb-1">Usuario</label>
        <input type="text" id="username" name="username" class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700
           shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
           transition duration-200" placeholder="Ingresa tu usuario">
      </div>

      <div>
        <label for="password" class="block text-gray-600 font-medium mb-1">Contraseña</label>
        <input type="password" id="password" name="password" class="w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700
           shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
           transition duration-200" placeholder="••••••••">
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
        Iniciar sesión
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      ¿Olvidaste tu contraseña?
      <a href="#" class="text-blue-600 hover:underline font-medium">Recuperala aquí</a>
    </p>
  </div>
</div>
{% endblock %}
